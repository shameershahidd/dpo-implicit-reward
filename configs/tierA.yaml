# main tier, sequences are at most 386 tokens (256 prompt, 128 response, 2 end tokens)
tier: tierA
seed: 42
model_name: Qwen/Qwen2.5-0.5B-Instruct
n_train: 2000
n_val: 500
n_test: 2000
max_prompt_tokens: 256
max_response_tokens: 128
# reward-bench limits, used for evaluation only
rb_max_prompt_tokens: 512
rb_max_response_tokens: 256
data_dir: data/processed
per_device_batch_size: 2
grad_accum_steps: 8
effective_batch_size: 16
max_steps: -1
logging_steps: 10
# used only by score.py, no gradients are kept, so it is not tied to the training batch size
score_batch_size: 4
