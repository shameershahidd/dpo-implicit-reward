# tiny run for the cpu smoke test
tier: smoke
seed: 42
model_name: Qwen/Qwen2.5-0.5B-Instruct
n_train: 64
n_val: 32
n_test: 32
max_prompt_tokens: 96
max_response_tokens: 32
# reward-bench limits, used for evaluation only
rb_max_prompt_tokens: 96
rb_max_response_tokens: 32
# score only a small random subset of reward-bench, so the smoke test stays fast
rb_max_pairs: 40
# the smoke tier scores reward-bench with the reward model and the best beta only, to save time
rb_all_betas: false
data_dir: data/processed
# plumbing only: a few real optimizer steps on a tiny set, not a training recipe
per_device_batch_size: 2
grad_accum_steps: 2
effective_batch_size: 4
max_steps: 3
# the smoke run has only 3 steps, so log every step to get a last logged loss
logging_steps: 1
# used only by score.py, no gradients are kept, so it is not tied to the training batch size
score_batch_size: 4
